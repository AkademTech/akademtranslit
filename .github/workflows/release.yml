# A tag v<version> builds, tests, publishes to PyPI through Trusted Publishing
# (no token anywhere; the `pypi` environment needs approval) and then creates
# the GitHub release. workflow_dispatch runs the build job only, as a dry run.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
      - name: Package version, and that the tag matches it
        id: version
        run: |
          version="$(uv run --no-project --python 3.12 -- python -c 'import sys; sys.path.insert(0, "src"); import akademtranslit; print(akademtranslit.__version__)')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the package version $version"
            exit 1
          fi
      - name: Golden vectors
        run: uv run --no-project --python 3.12 -- python tools/golden.py --check
      - name: Validate classifiers
        run: uv run --no-project --python 3.12 --with trove-classifiers -- python tools/check_classifiers.py
      - name: Build sdist and wheel
        run: uv build --out-dir dist
      - name: Check metadata
        run: uvx twine check --strict dist/*
      - name: Test the installed wheel in a clean Python 3.9
        run: |
          uv venv --python 3.9 .wheeltest
          uv pip install --python .wheeltest/bin/python dist/*.whl pytest
          .wheeltest/bin/python -m pytest -o pythonpath= -o addopts= tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release
          path: |
            dist/*
            golden/inputs.json
            golden/golden-${{ steps.version.outputs.version }}.json
            golden/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/akademtranslit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release
          path: artifact
      # Trusted Publishing: no token. Attestations are on by default.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: artifact/dist/

  github-release:
    needs: [build, publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release
          path: artifact
      - name: Release notes from CHANGELOG.md
        run: |
          python3 - <<'PY'
          import os, re
          version = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(r"^## " + re.escape(version) + r"\b.*?$(.*?)(?=^## |\Z)", text, re.M | re.S)
          if not match:
              raise SystemExit(f"no '## {version}' section in CHANGELOG.md")
          with open("notes.md", "w", encoding="utf-8", newline="\n") as f:
              f.write(match.group(1).strip() + "\n")
          PY
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifact/dist/* \
            artifact/golden/inputs.json \
            "artifact/golden/golden-$VERSION.json" \
            artifact/golden/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "AkademTranslit $VERSION" \
            --notes-file notes.md \
            --verify-tag
