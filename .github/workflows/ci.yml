name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: false
      - name: Test suite
        run: uv run --no-project --python ${{ matrix.python }} --with pytest -- python -m pytest
      - name: Golden vectors
        run: uv run --no-project --python ${{ matrix.python }} -- python tools/golden.py --check

  javascript:
    name: test (JavaScript port, Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: false
      # The fixtures in js/test/fixtures/ are made by the Python library;
      # this fails when the library changes and they are not made again.
      # The Python is the minor version that made them, 3.12: the output
      # depends on its Unicode data (15.0.0), and unicode-15.0.0.json
      # records 3.12 only, so any 3.12.x makes the same files.
      - name: Fixtures match the Python library
        run: uv run --no-project --python 3.12 -- python js/tools/make-fixtures.py --check
      # The port has no dependencies: nothing is installed for it.
      - name: Test suite
        working-directory: js
        run: node --test test/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: false
      - name: Validate classifiers
        run: uv run --no-project --python 3.12 --with trove-classifiers -- python tools/check_classifiers.py
      - name: Build sdist and wheel
        run: uv build --out-dir dist
      - name: Check metadata
        run: uvx twine check --strict dist/*
      - name: Test the installed wheel in a clean Python 3.9
        run: |
          uv venv --python 3.9 .wheeltest
          uv pip install --python .wheeltest/bin/python dist/*.whl pytest
          .wheeltest/bin/python -m pytest -o pythonpath= -o addopts= tests
