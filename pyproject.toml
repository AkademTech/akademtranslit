[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "akademtranslit"
dynamic = ["version"]
description = "Uzbek transliteration across three orthographies: Cyrillic, the 1995 Latin alphabet, and the 2026 reform."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AkademTech", email = "contact@akademtech.org" }]
keywords = [
    "uzbek",
    "transliteration",
    "cyrillic",
    "latin",
    "romanization",
    "normalization",
    "alphabet-reform",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Uzbek",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://akademtech.org"
Source = "https://github.com/AkademTech/akademtranslit"
Changelog = "https://github.com/AkademTech/akademtranslit/blob/main/CHANGELOG.md"
Issues = "https://github.com/AkademTech/akademtranslit/issues"

[tool.setuptools.dynamic]
version = { attr = "akademtranslit.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
akademtranslit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# So `pytest` works straight from a clone, with no install step.
pythonpath = ["src"]
