[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "akademtranslit"
version = "0.1.0"
description = "Uzbek transliteration across three orthographies: Cyrillic, the 1995 Latin alphabet, and the 2026 reform."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "AkademTech" }]
keywords = [
    "uzbek",
    "transliteration",
    "cyrillic",
    "latin",
    "romanization",
    "normalization",
    "alphabet-reform",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Uzbek",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://akademtech.org"
Source = "https://github.com/akademtech/akademtranslit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# So `pytest` works straight from a clone, with no install step.
pythonpath = ["src"]
